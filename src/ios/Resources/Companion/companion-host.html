<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minis Companion Native Host</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #companion-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="companion-container"></div>
  <script src="minis-companion.js"></script>
  <script>
    // 初始化吉祥物单例
    var container = document.getElementById('companion-container');
    var size = Math.min(window.innerWidth, window.innerHeight) || 36;
    
    var companion = new MinisCompanion({
      container: container,
      size: size,
      state: 'idle',
      interactive: true,
      idPrefix: 'native_'
    });

    window.companion = companion;

    // 暴露给原生 Swift 调用的统一接口
    window.setCompanionState = function(state) {
      if (window.companion) {
        window.companion.setState(state);
      }
    };

    window.setCompanionSize = function(newSize) {
      if (window.companion) {
        window.companion.setSize(newSize);
      }
    };

    // 窗口尺寸变化自适应
    window.addEventListener('resize', function() {
      var s = Math.min(window.innerWidth, window.innerHeight);
      if (s > 0 && window.companion) {
        window.companion.setSize(s);
      }
    });
  </script>
</body>
</html>
