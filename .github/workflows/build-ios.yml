name: Build Custom Minis iOS IPA

on:
  push:
    branches: [ main, dev, feature/*, feat/* ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Minis iOS (Unsigned IPA)
    runs-on: macos-26 # Apple Silicon, ships Xcode 26 (iOS 26 SDK)
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app 2>/dev/null || true
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH=/Applications/Xcode.app; fi
          echo "Switching to $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install System Dependencies
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/libarchive/bin" >> $GITHUB_PATH

      - name: Setup Config Templates
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Verify Mascot Assets Exist
        run: |
          ls -lh src/ios/Resources/Companion/companion-host.html
          ls -lh src/ios/Resources/Companion/minis-companion.js

      - name: Build Native Dependencies (LAME, FFmpeg, iSH, Alpine, Rclone)
        run: |
          chmod +x ./deps/*.sh
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -destination "generic/platform=iOS" \
            -archivePath build/Minis.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Raw Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Minis.xcarchive/Products/Applications/Minis.app build/Payload/
          # 确保 Companion Web 资产直接打入 App 包体根目录，Bundle.main 秒级读取
          cp -f src/ios/Resources/Companion/companion-host.html build/Payload/Minis.app/
          cp -f src/ios/Resources/Companion/minis-companion.js build/Payload/Minis.app/
          cd build
          zip -qry9 Minis-Companion-Raw.ipa Payload/
          ls -lh Minis-Companion-Raw.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-Companion-Raw-IPA
          path: build/Minis-Companion-Raw.ipa
          retention-days: 7
