name: Probe Xcode
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-xcode.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Show runner + Xcode
        run: |
          echo "RUNNER=${{ matrix.runner }}"
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version || true
